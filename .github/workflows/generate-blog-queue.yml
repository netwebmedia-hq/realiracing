name: Generate Blog Queue (Weekly)

# Runs every Monday at 10:00 UTC (6 AM Santiago).
# Generates ~20 posts (2/day cadence matches the publish workflow below).
# Claude calls use the CLAUDE_CODE_OAUTH_TOKEN secret (Max subscription, minted
# with `claude setup-token`) when set, else the ANTHROPIC_API_KEY repo secret.
# Requires one of the two — see the "Require Claude credentials" step;
# if it's missing this workflow skips gracefully instead of hard-failing the
# scheduled run.

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of posts to generate'
        default: '20'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 20 posts at one-per-call, allowing for retries. The 2026-09-16 run hit the
    # old 30-minute ceiling mid-run and GitHub cancelled the job, which skipped
    # the commit step and threw away everything it had written.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FAIL, don't skip.
      #
      # This step used to emit a ::warning:: and set has_key=false, which made
      # the two steps below `if:`-skip while the job still reported SUCCESS.
      # The secret was never added, so that is exactly what happened every
      # Monday from 2026-07-27 to 2026-09-14: nine consecutive green runs,
      # 15-20 seconds each, generating nothing. The queue sat at 0 and
      # realiracing.com published nothing for seven weeks with no red run
      # anywhere to say so.
      #
      # A missing secret is a broken pipeline, not a quiet week. deploy.yml in
      # this same repo already gets this right for the FTP secrets — ::error::
      # and exit 1 — and the monorepo's golferos generator says it outright:
      # "Without it the job fails loudly rather than shipping nothing quietly."
      - name: Require Claude credentials
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set, so this run cannot generate anything. Add one at https://github.com/netwebmedia/realiracing/settings/secrets/actions/new. This fails instead of passing silently — nine scheduled runs once reported success while doing nothing."
            exit 1
          fi
          echo "✓ credentials present"

      # Claude calls run on the Claude Max subscription when CLAUDE_CODE_OAUTH_TOKEN
      # is set (see _deploy/lib/claude-call.js), with ANTHROPIC_API_KEY as the
      # fallback. The SDK installs outside the repo so package.json stays untouched.
      - name: Install Claude Agent SDK
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN -- calls use ANTHROPIC_API_KEY"; exit 0; fi
          npm install --prefix "$RUNNER_TEMP/agent-sdk" --no-audit --no-fund --loglevel=error @anthropic-ai/claude-agent-sdk@^0.3

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_AGENT_SDK_DIR: ${{ runner.temp }}/agent-sdk
        run: |
          COUNT="${{ github.event.inputs.count || '20' }}"
          node _deploy/generate-post-queue.js --count "$COUNT"

      # if: always() so a job timeout still banks what was written.
      #
      # Every post is on disk the moment it is generated, but the commit only
      # happened at the very end — so when the 2026-09-16 run was cancelled at
      # the timeout, the whole run's output died with the runner: generated,
      # paid for, discarded. always() runs on cancellation too, so a slow run
      # now keeps its work instead of losing all of it.
      - name: Commit new posts
        if: always()
        run: |
          git config user.name "RealIRacing Blog Bot"
          git config user.email "bot@realiracing.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git add _deploy/posts-queue/
          git diff --cached --quiet && echo "Nothing new to commit" && exit 0
          git commit -m "chore: auto-generate $(git diff --cached --name-only | wc -l | tr -d ' ') blog posts for queue"
          # Retry push with rebase --autostash for concurrent push + unstaged residuals
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $attempt failed — retrying after $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

      # Topic-pool runway ALERT. Runs after the commit, so this run's posts are
      # already banked when it fails. In deploy.yml the same check only warns,
      # because a deploy ships finished posts and blocking it fixes nothing.
      # Here a low pool means the next Monday run will come up short. A red run
      # (and the failure email) is the alert. The fix is new topics in
      # TOPIC_POOL in _deploy/generate-post-queue.js.
      - name: Topic pool runway alert
        if: always()
        run: node _ci/validate-blog-queue.mjs --strict-topics
